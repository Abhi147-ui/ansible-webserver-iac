---
- name: Install and configure Apache web servers
  hosts: webservers
  become: true

  vars_files:
    - ../group_vars/all.yml

  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install Apache
      ansible.builtin.package:
        name: "{{ apache_package }}"
        state: present

    - name: Start and enable Apache service
      ansible.builtin.service:
        name: "{{ apache_service }}"
        state: started
        enabled: true

    - name: Create admin group
      ansible.builtin.group:
        name: "{{ admin_group }}"
        state: present

    - name: Create administrative users
      ansible.builtin.user:
        name: "{{ item.name }}"
        comment: "{{ item.comment }}"
        groups: "{{ admin_group }}"
        append: true
        shell: /bin/bash
        create_home: true
        state: present
      loop: "{{ admin_users }}"

    - name: Give admin group passwordless sudo
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ admin_group }}"
        content: "%{{ admin_group }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Deploy company homepage
      ansible.builtin.template:
        src: ../templates/index.html.j2
        dest: "{{ web_root }}/index.html"
        owner: root
        group: root
        mode: "0644"
      notify: Restart Apache

    - name: Verify website responds with HTTP 200
      ansible.builtin.uri:
        url: "http://localhost"
        status_code: 200
      register: site_check
      retries: 3
      delay: 3
      until: site_check.status == 200

  handlers:
    - name: Restart Apache
      ansible.builtin.service:
        name: "{{ apache_service }}"
        state: restarted
